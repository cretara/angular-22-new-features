<mat-sidenav-container class="sidenav-container" [class.sidenav-mobile]="mobileQuery()">
  <mat-sidenav [mode]="mobileQuery() ? 'over' : 'side'" [fixedInViewport]="mobileQuery()"
               fixedTopGap="56">
    <mat-nav-list>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-card class="card">
      <mat-card-header>
        <mat-card-title>{{header}}</mat-card-title>
        <mat-card-subtitle></mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <router-outlet></router-outlet>
      </mat-card-content>
    </mat-card>

  </mat-sidenav-content>
</mat-sidenav-container>
